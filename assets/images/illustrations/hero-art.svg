<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" fill="none">
  <!-- Minimal Clean Background -->
  <rect width="540" height="400" rx="16" fill="#F8FAFC" />
  
  <!-- Subtle Grid Lines (Architectural / City Planning) -->
  <line x1="60" y1="40" x2="60" y2="360" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="180" y1="40" x2="180" y2="360" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="360" y1="40" x2="360" y2="360" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="480" y1="40" x2="480" y2="360" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="40" y1="280" x2="500" y2="280" stroke="#CBD5E1" stroke-width="2" />

  <!-- Clean Sun / Optimism Circle -->
  <circle cx="430" cy="90" r="36" fill="#FDE68A" />

  <!-- Minimal Abstract City Silhouette -->
  <rect x="90" y="160" width="55" height="120" rx="4" fill="#E0E7FF" />
  <rect x="155" y="120" width="65" height="160" rx="4" fill="#312E81" />
  <rect x="230" y="180" width="50" height="100" rx="4" fill="#CCFBF1" />
  <rect x="290" y="140" width="70" height="140" rx="4" fill="#E2E8F0" />
  <rect x="370" y="170" width="60" height="110" rx="4" fill="#FFE4E6" />

  <!-- Building Windows (Minimal Dots) -->
  <circle cx="175" cy="145" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="200" cy="145" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="175" cy="170" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="200" cy="170" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="175" cy="195" r="3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="200" cy="195" r="3" fill="#FFFFFF" opacity="0.8" />

  <!-- Minimal Pedestrian Crossing / Shared Space -->
  <g transform="translate(100, 305)">
    <rect x="0" y="0" width="40" height="16" rx="3" fill="#312E81" />
    <rect x="60" y="0" width="40" height="16" rx="3" fill="#312E81" />
    <rect x="120" y="0" width="40" height="16" rx="3" fill="#312E81" />
    <rect x="180" y="0" width="40" height="16" rx="3" fill="#312E81" />
    <rect x="240" y="0" width="40" height="16" rx="3" fill="#312E81" />
    <rect x="300" y="0" width="40" height="16" rx="3" fill="#312E81" />
  </g>

  <!-- Youth Figures - Minimal Line & Flat Art -->
  <!-- Figure 1: Walking / Crossing (Teal) -->
  <g transform="translate(160, 215)">
    <circle cx="18" cy="12" r="10" fill="#14B8A6" />
    <rect x="10" y="26" width="16" height="28" rx="6" fill="#14B8A6" />
    <line x1="14" y1="54" x2="8" y2="78" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
    <line x1="22" y1="54" x2="28" y2="78" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Figure 2: Leading Civic Action (Pink) -->
  <g transform="translate(250, 195)">
    <circle cx="20" cy="12" r="10" fill="#F43F5E" />
    <rect x="11" y="26" width="18" height="34" rx="6" fill="#F43F5E" />
    <line x1="15" y1="60" x2="12" y2="98" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
    <line x1="25" y1="60" x2="28" y2="98" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
    <!-- Civic Sign / Indicator -->
    <line x1="28" y1="36" x2="48" y2="15" stroke="#F43F5E" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="52" cy="12" r="8" fill="#14B8A6" />
    <path d="M49 12 L51 14 L55 10" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Figure 3: Collaborating / Planting Care (Indigo) -->
  <g transform="translate(345, 225)">
    <circle cx="16" cy="12" r="10" fill="#312E81" />
    <rect x="8" y="26" width="16" height="26" rx="6" fill="#312E81" />
    <line x1="12" y1="52" x2="10" y2="68" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
    <line x1="20" y1="52" x2="24" y2="68" stroke="#1F2937" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Minimal Badge -->
  <g transform="translate(40, 45)">
    <rect x="0" y="0" width="145" height="32" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="16" cy="16" r="6" fill="#14B8A6" />
    <text x="32" y="20" fill="#312E81" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">CIVICALLY ABLED</text>
  </g>
</svg>
